services:
  postgres:
    image: postgres:16-alpine
    container_name: shelfflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelfflow
      POSTGRES_PASSWORD: shelfflow_dev_password
      POSTGRES_DB: shelfflow
    ports:
      - "5432:5432"
    volumes:
      - shelfflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfflow -d shelfflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelfflow-postgres-data: